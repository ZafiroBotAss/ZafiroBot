name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Z4firo.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: Z4firo.apk
          name: Z4firo ${{ github.ref_name }}
          body: APK de depuración. Instálalo y pega tu API key de Anthropic en Ajustes.
